name: Validate AstroAI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/astrology/requirements.txt

      - name: Install application dependencies
        run: |
          npm ci
          python -m pip install -r services/astrology/requirements.txt

      - name: Test and build
        run: |
          npm run build
          python -m pytest services/astrology -q

      - name: Package Lambda artifacts
        run: bash scripts/package-lambdas.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.0"

      - name: Validate Terraform formatting
        run: terraform fmt -check -recursive infra

      - name: Validate bootstrap configuration
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate application configuration
        working-directory: infra/application
        run: |
          terraform init -backend=false
          terraform validate
