name: Deploy AstroAI to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astroai-dev-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.0"
          terraform_wrapper: false

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install, test, and package
        run: |
          npm ci
          python -m pip install -r services/astrology/requirements.txt
          python -m pytest services/astrology -q
          bash scripts/package-lambdas.sh

      - name: Initialize Terraform state
        working-directory: infra/application
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=astroai/dev/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Plan infrastructure changes
        working-directory: infra/application
        run: terraform plan -input=false -out=tfplan -var="aws_region=${AWS_REGION}"

      - name: Apply infrastructure changes
        working-directory: infra/application
        run: terraform apply -input=false -auto-approve tfplan

      - name: Read deployment outputs
        id: infrastructure
        working-directory: infra/application
        run: |
          echo "api_url=$(terraform output -raw api_url)" >> "$GITHUB_OUTPUT"
          echo "website_url=$(terraform output -raw website_url)" >> "$GITHUB_OUTPUT"
          echo "web_bucket=$(terraform output -raw web_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"

      - name: Build static frontend
        env:
          AWS_STATIC_EXPORT: "true"
          NEXT_PUBLIC_API_URL: ${{ steps.infrastructure.outputs.api_url }}
        run: npm run build --workspace @astroai/web

      - name: Publish frontend
        run: |
          aws s3 sync apps/web/out "s3://${{ steps.infrastructure.outputs.web_bucket }}" --delete
          aws cloudfront create-invalidation --distribution-id "${{ steps.infrastructure.outputs.distribution_id }}" --paths '/*'

      - name: Smoke test API
        run: curl --fail --retry 6 --retry-delay 5 "${{ steps.infrastructure.outputs.api_url }}/health"

      - name: Deployment summary
        run: |
          echo "### AstroAI deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Website: ${{ steps.infrastructure.outputs.website_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: ${{ steps.infrastructure.outputs.api_url }}" >> "$GITHUB_STEP_SUMMARY"
