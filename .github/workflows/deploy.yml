name: Deploy AstroAI to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astroai-dev-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/astrology/requirements.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.0"
          terraform_wrapper: false

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Test applications
        run: |
          npm ci
          python -m pip install -r services/astrology/requirements.txt
          npm run build
          python -m pytest services/astrology -q

      - name: Initialize Terraform state
        working-directory: infra/application
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=astroai/dev/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Plan infrastructure changes
        working-directory: infra/application
        run: terraform plan -input=false -out=tfplan -var="aws_region=${AWS_REGION}"

      - name: Apply infrastructure changes
        working-directory: infra/application
        run: terraform apply -input=false -auto-approve tfplan

      - name: Read deployment outputs
        id: infrastructure
        working-directory: infra/application
        run: |
          echo "website_url=$(terraform output -raw website_url)" >> "$GITHUB_OUTPUT"
          echo "public_ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"
          echo "instance_id=$(terraform output -raw instance_id)" >> "$GITHUB_OUTPUT"
          echo "reports_bucket=$(terraform output -raw reports_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "reports_table=$(terraform output -raw reports_table_name)" >> "$GITHUB_OUTPUT"
          echo "web_repo=$(terraform output -raw web_repository_url)" >> "$GITHUB_OUTPUT"
          echo "api_repo=$(terraform output -raw api_repository_url)" >> "$GITHUB_OUTPUT"
          echo "calculator_repo=$(terraform output -raw calculator_repository_url)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and publish web image
        run: |
          docker buildx build --platform linux/amd64 --push \
            --file apps/web/Dockerfile.aws \
            --build-arg NEXT_PUBLIC_API_URL=/api \
            --tag "${{ steps.infrastructure.outputs.web_repo }}:${IMAGE_TAG}" .

      - name: Build and publish API image
        run: |
          docker buildx build --platform linux/amd64 --push \
            --file apps/api/Dockerfile \
            --tag "${{ steps.infrastructure.outputs.api_repo }}:${IMAGE_TAG}" .

      - name: Build and publish calculator image
        run: |
          docker buildx build --platform linux/amd64 --push \
            --file services/astrology/Dockerfile \
            --tag "${{ steps.infrastructure.outputs.calculator_repo }}:${IMAGE_TAG}" services/astrology

      - name: Wait for Systems Manager
        env:
          INSTANCE_ID: ${{ steps.infrastructure.outputs.instance_id }}
        run: |
          for attempt in $(seq 1 60); do
            if aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text | grep -q Online; then
              exit 0
            fi
            echo "Waiting for EC2 to register with Systems Manager (${attempt}/60)"
            sleep 10
          done
          echo "EC2 did not become available in Systems Manager" >&2
          exit 1

      - name: Deploy containers through Systems Manager
        env:
          INSTANCE_ID: ${{ steps.infrastructure.outputs.instance_id }}
          PUBLIC_IP: ${{ steps.infrastructure.outputs.public_ip }}
          REPORTS_BUCKET: ${{ steps.infrastructure.outputs.reports_bucket }}
          REPORTS_TABLE: ${{ steps.infrastructure.outputs.reports_table }}
          WEB_REPO: ${{ steps.infrastructure.outputs.web_repo }}
          API_REPO: ${{ steps.infrastructure.outputs.api_repo }}
          CALCULATOR_REPO: ${{ steps.infrastructure.outputs.calculator_repo }}
        run: |
          registry="${WEB_REPO%%/*}"
          deploy_script=$(cat <<EOF
          set -euxo pipefail
          aws ecr get-login-password --region '${AWS_REGION}' | docker login --username AWS --password-stdin '${registry}'
          docker pull '${CALCULATOR_REPO}:${IMAGE_TAG}'
          docker pull '${API_REPO}:${IMAGE_TAG}'
          docker pull '${WEB_REPO}:${IMAGE_TAG}'
          docker rm -f astroai-web astroai-api astroai-calculator 2>/dev/null || true
          docker network inspect astroai >/dev/null 2>&1 || docker network create astroai
          docker run -d --name astroai-calculator --restart unless-stopped --network astroai --network-alias calculator --memory 192m '${CALCULATOR_REPO}:${IMAGE_TAG}'
          docker run -d --name astroai-api --restart unless-stopped --network astroai --network-alias api --memory 384m \
            -e PORT=3001 \
            -e AWS_REGION='${AWS_REGION}' \
            -e ASTROLOGY_SERVICE_URL='http://calculator:8000' \
            -e REPORTS_TABLE_NAME='${REPORTS_TABLE}' \
            -e REPORTS_BUCKET_NAME='${REPORTS_BUCKET}' \
            -e WEB_ORIGIN='http://${PUBLIC_IP}' \
            '${API_REPO}:${IMAGE_TAG}'
          docker run -d --name astroai-web --restart unless-stopped --network astroai --memory 96m -p 80:80 '${WEB_REPO}:${IMAGE_TAG}'
          for attempt in \$(seq 1 30); do
            curl --fail --silent http://localhost/api/health && exit 0
            sleep 2
          done
          docker logs astroai-api
          exit 1
          EOF
          )
          encoded_script=$(printf '%s' "$deploy_script" | base64 -w 0)
          parameters=$(jq -n --arg command "echo '${encoded_script}' | base64 -d | bash" '{commands: [$command]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy AstroAI ${IMAGE_TAG}" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)
          for attempt in $(seq 1 60); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut) echo "Deployment command ended with ${status}" >&2; exit 1 ;;
            esac
            sleep 5
          done
          final_status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text)
          test "$final_status" = "Success"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID"

      - name: Smoke test deployment
        run: |
          curl --fail --retry 12 --retry-delay 5 "${{ steps.infrastructure.outputs.website_url }}/api/health"
          curl --fail --retry 12 --retry-delay 5 "${{ steps.infrastructure.outputs.website_url }}/"

      - name: Deployment summary
        run: |
          echo "### AstroAI EC2 deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Website: ${{ steps.infrastructure.outputs.website_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- API health: ${{ steps.infrastructure.outputs.website_url }}/api/health" >> "$GITHUB_STEP_SUMMARY"
          echo "- Instance: ${{ steps.infrastructure.outputs.instance_id }}" >> "$GITHUB_STEP_SUMMARY"
